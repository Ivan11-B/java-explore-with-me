services:
  stats-server:
    ports:
      - "9090:9090"
    build:
      context: ./ewn-stats-service/server
      dockerfile: Dockerfile
    container_name: stats-server
    depends_on:
          stats-db:
             condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9090/actuator/health || exit 1" ]
      timeout: 10s
      interval: 30s
      retries: 3
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://stats-db:5432/stats"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "postgres"

  stats-db:
    image: postgres:16.1
    container_name: stats-db
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres/stats-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: 'stats'
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d stats" ]
      timeout: 5s
      interval: 5s
      retries: 10


  ewn-server:
    ports:
      - "8080:8080"
    build:
      context: ./ewn-main-service
      dockerfile: Dockerfile
    container_name: ewn-server
    depends_on:
      ewn-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      timeout: 10s
      interval: 30s
      retries: 3
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://ewn-db:5432/ewn-db"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "postgres"

  ewn-db:
    image: postgres:16.1
    container_name: ewn-db
    ports:
      - "5433:5432"
    volumes:
      - ./volumes/postgres/ewn-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: 'ewn'
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ewn" ]
      timeout: 5s
      interval: 5s
      retries: 10

networks:
  default:
    name: ewn-network
    driver: bridge

